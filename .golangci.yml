# Fleet lint floor. Generated by `conform init`; the lint-floor rule
# checks this file as parsed sets, so per-repo extras are free.
version: "2"

linters:
  default: standard
  enable:
    - nilerr
    - rowserrcheck
    - noctx
    - staticcheck
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
